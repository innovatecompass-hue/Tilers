<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Daltile Product Catalog — Custom Collection</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --brand:      #1a1a2e;
    --brand-mid:  #16213e;
    --accent:     #e94560;
    --gold:       #c9a84c;
    --bg:         #f4f4f0;
    --card-bg:    #ffffff;
    --text:       #1a1a1a;
    --text-muted: #6b6b6b;
    --border:     #e0ddd6;
    --sidebar-w:  260px;
    --radius:     10px;
    --shadow:     0 2px 12px rgba(0,0,0,.08);
    --shadow-hover: 0 8px 32px rgba(0,0,0,.15);
  }

  html { scroll-behavior: smooth; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-mid) 60%, #0f3460 100%);
    color: #fff; padding: 0 32px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px; min-height: 72px;
    box-shadow: 0 2px 20px rgba(0,0,0,.3);
    position: sticky; top: 0; z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 44px; height: 44px; border-radius: 8px;
    background: linear-gradient(135deg, var(--gold), #f0c97a);
    display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 8px;
  }
  .logo-icon span { background: var(--brand); border-radius: 2px; }
  .logo h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.3px; }
  .logo h1 small { display: block; font-size: .65rem; font-weight: 400; color: rgba(255,255,255,.6); letter-spacing: 2px; text-transform: uppercase; margin-top: 1px; }
  .header-stats { display: flex; gap: 28px; }
  .stat { text-align: center; }
  .stat strong { display: block; font-size: 1.3rem; font-weight: 700; color: var(--gold); }
  .stat span { font-size: .7rem; color: rgba(255,255,255,.6); text-transform: uppercase; letter-spacing: 1px; }

  /* ── LAYOUT ── */
  .layout { display: flex; min-height: calc(100vh - 72px); }

  /* ── SIDEBAR ── */
  aside {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--card-bg); border-right: 1px solid var(--border);
    padding: 20px 16px; position: sticky; top: 72px;
    height: calc(100vh - 72px); overflow-y: auto;
  }
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .filter-section { margin-bottom: 24px; }
  .filter-section h3 {
    font-size: .68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 10px;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .filter-options { display: flex; flex-direction: column; gap: 4px; }
  .filter-btn {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; border-radius: 6px; border: none; background: transparent;
    font-size: .83rem; color: var(--text); cursor: pointer; text-align: left;
    transition: background .15s, color .15s;
  }
  .filter-btn:hover { background: var(--bg); }
  .filter-btn.active { background: var(--brand); color: #fff; }
  .filter-btn .count { font-size: .72rem; color: inherit; opacity: .6; }
  .filter-btn.active .count { opacity: .8; }

  .clear-btn {
    width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px;
    background: transparent; color: var(--text-muted); font-size: .8rem; cursor: pointer;
    transition: all .15s; margin-top: 8px;
  }
  .clear-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── MAIN ── */
  main { flex: 1; padding: 24px 28px; min-width: 0; }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 24px; flex-wrap: wrap;
  }
  .search-wrap { flex: 1; min-width: 220px; position: relative; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  #search {
    width: 100%; padding: 10px 12px 10px 38px;
    border: 1.5px solid var(--border); border-radius: 8px;
    font-size: .9rem; background: var(--card-bg); color: var(--text);
    transition: border-color .2s;
  }
  #search:focus { outline: none; border-color: var(--brand); }
  .sort-wrap { display: flex; align-items: center; gap: 8px; }
  .sort-wrap label { font-size: .8rem; color: var(--text-muted); white-space: nowrap; }
  #sort {
    padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px;
    font-size: .85rem; background: var(--card-bg); color: var(--text); cursor: pointer;
  }
  #sort:focus { outline: none; border-color: var(--brand); }
  .results-count { font-size: .82rem; color: var(--text-muted); white-space: nowrap; }
  .results-count strong { color: var(--text); }

  /* ── ACTIVE FILTERS ── */
  .active-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .filter-tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 20px;
    background: var(--brand); color: #fff; font-size: .76rem;
  }
  .filter-tag button { background: none; border: none; color: #fff; cursor: pointer; opacity: .7; padding: 0; line-height: 1; font-size: .9rem; }
  .filter-tag button:hover { opacity: 1; }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }

  /* ── PRODUCT CARD ── */
  .card {
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden; cursor: pointer;
    transition: transform .2s, box-shadow .2s;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }

  .swatch {
    height: 160px; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .swatch-inner {
    position: absolute; inset: 0;
    transition: transform .4s ease;
  }
  .card:hover .swatch-inner { transform: scale(1.04); }
  .swatch-tile {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr); gap: 2px;
    padding: 2px; background: #e0ddd6;
  }
  .swatch-tile span { border-radius: 1px; }

  .badges { position: absolute; top: 10px; left: 10px; display: flex; gap: 5px; flex-wrap: wrap; }
  .badge {
    padding: 3px 8px; border-radius: 20px; font-size: .67rem;
    font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  }
  .badge-new     { background: var(--accent);  color: #fff; }
  .badge-best    { background: var(--gold);    color: #fff; }
  .badge-usa     { background: #2d6a4f;        color: #fff; }
  .badge-outdoor { background: #457b9d;        color: #fff; }

  .card-body { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; }
  .series-name { font-size: .72rem; font-weight: 600; color: var(--gold); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }
  .card-name { font-size: .92rem; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 8px; }
  .specs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .spec { padding: 2px 7px; border-radius: 4px; background: var(--bg); font-size: .72rem; color: var(--text-muted); }
  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
  .price { font-size: 1rem; font-weight: 700; color: var(--text); }
  .price-unit { font-size: .72rem; font-weight: 400; color: var(--text-muted); }
  .stars { color: #f4b400; font-size: .82rem; letter-spacing: .5px; }
  .review-count { font-size: .7rem; color: var(--text-muted); }

  /* ── EMPTY STATE ── */
  .empty { text-align: center; padding: 80px 20px; color: var(--text-muted); }
  .empty svg { opacity: .2; margin-bottom: 16px; }
  .empty h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }

  /* ── MODAL ── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    z-index: 200; display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--card-bg); border-radius: 14px;
    max-width: 820px; width: 100%; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 24px 80px rgba(0,0,0,.3);
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal-inner { display: flex; flex-direction: column; }
  .modal-hero { height: 280px; position: relative; border-radius: 14px 14px 0 0; overflow: hidden; }
  .modal-hero-swatch { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(5, 1fr); gap: 3px; padding: 3px; background: #ddd; }
  .modal-hero-swatch span { border-radius: 2px; }
  .modal-body { padding: 28px 32px; }
  .modal-series { font-size: .8rem; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .modal-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 12px; line-height: 1.2; }
  .modal-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .modal-desc { font-size: .92rem; color: var(--text-muted); line-height: 1.65; margin-bottom: 24px; }

  .modal-specs-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    margin-bottom: 24px;
  }
  .spec-item { background: var(--bg); border-radius: 8px; padding: 12px; }
  .spec-item .label { font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 4px; }
  .spec-item .value { font-size: .92rem; font-weight: 600; color: var(--text); }

  .modal-apps { margin-bottom: 24px; }
  .modal-apps h4 { font-size: .78rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 10px; }
  .app-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .app-tag { padding: 5px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: .8rem; color: var(--text); }

  .modal-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px; border-top: 1px solid var(--border);
    background: var(--bg); border-radius: 0 0 14px 14px;
  }
  .modal-price { font-size: 1.5rem; font-weight: 700; }
  .modal-price small { font-size: .85rem; font-weight: 400; color: var(--text-muted); }
  .modal-rating { display: flex; align-items: center; gap: 8px; }
  .modal-stars { color: #f4b400; font-size: 1rem; }
  .modal-close {
    position: absolute; top: 14px; right: 14px;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(0,0,0,.45); border: none; color: #fff;
    font-size: 1.1rem; cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: background .15s;
  }
  .modal-close:hover { background: rgba(0,0,0,.7); }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    aside { display: none; }
    .layout { display: block; }
    main { padding: 16px; }
  }
  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    .header-stats { display: none; }
    .modal-specs-grid { grid-template-columns: 1fr 1fr; }
    .modal-body { padding: 20px; }
    .modal-footer { padding: 16px 20px; flex-direction: column; gap: 12px; align-items: flex-start; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <span></span><span></span><span></span><span></span>
    </div>
    <h1>Daltile<small>Custom Product Catalog</small></h1>
  </div>
  <div class="header-stats">
    <div class="stat"><strong id="stat-total">—</strong><span>Products</span></div>
    <div class="stat"><strong id="stat-series">—</strong><span>Series</span></div>
    <div class="stat"><strong id="stat-cats">—</strong><span>Categories</span></div>
  </div>
</header>

<div class="layout">
  <aside id="sidebar">
    <div class="filter-section">
      <h3>Category</h3>
      <div class="filter-options" id="filter-category"></div>
    </div>
    <div class="filter-section">
      <h3>Material</h3>
      <div class="filter-options" id="filter-material"></div>
    </div>
    <div class="filter-section">
      <h3>Look / Style</h3>
      <div class="filter-options" id="filter-look"></div>
    </div>
    <div class="filter-section">
      <h3>Finish</h3>
      <div class="filter-options" id="filter-finish"></div>
    </div>
    <div class="filter-section">
      <h3>Series</h3>
      <div class="filter-options" id="filter-series"></div>
    </div>
    <div class="filter-section">
      <h3>Features</h3>
      <div class="filter-options" id="filter-features"></div>
    </div>
    <button class="clear-btn" onclick="clearAll()">Clear all filters</button>
  </aside>

  <main>
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="search" type="text" placeholder="Search products, series, color…" oninput="applyFilters()"/>
      </div>
      <div class="sort-wrap">
        <label for="sort">Sort by</label>
        <select id="sort" onchange="applyFilters()">
          <option value="default">Default</option>
          <option value="price-asc">Price: Low → High</option>
          <option value="price-desc">Price: High → Low</option>
          <option value="rating">Highest Rated</option>
          <option value="reviews">Most Reviewed</option>
          <option value="name">Name A → Z</option>
          <option value="new">New First</option>
        </select>
      </div>
      <div class="results-count" id="results-count"></div>
    </div>
    <div class="active-filters" id="active-filters"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">
      <svg width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/></svg>
      <h3>No products match your filters</h3>
      <p>Try adjusting your search or clearing some filters.</p>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modal-backdrop" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-inner">
      <div class="modal-hero" id="modal-hero">
        <div class="modal-hero-swatch" id="modal-hero-swatch"></div>
        <button class="modal-close" onclick="closeModalDirect()">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-series" id="modal-series"></div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-badges" id="modal-badges"></div>
        <div class="modal-desc" id="modal-desc"></div>
        <div class="modal-specs-grid" id="modal-specs"></div>
        <div class="modal-apps">
          <h4>Best For</h4>
          <div class="app-tags" id="modal-apps"></div>
        </div>
      </div>
      <div class="modal-footer">
        <div>
          <div class="modal-price" id="modal-price"></div>
          <div style="font-size:.75rem;color:var(--text-muted);margin-top:2px;" id="modal-coverage"></div>
        </div>
        <div class="modal-rating">
          <div class="modal-stars" id="modal-stars"></div>
          <div style="font-size:.82rem;color:var(--text-muted)" id="modal-reviews"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let PRODUCTS = [];
let activeFilters = {};

/* ── LOAD & INIT ── */
fetch('products.json')
  .then(r => r.json())
  .then(data => {
    PRODUCTS = data;
    initStats();
    buildFilterPanels();
    applyFilters();
  });

function initStats() {
  document.getElementById('stat-total').textContent = PRODUCTS.length;
  const series = new Set(PRODUCTS.map(p => p.series));
  const cats   = new Set(PRODUCTS.map(p => p.category));
  document.getElementById('stat-series').textContent = series.size;
  document.getElementById('stat-cats').textContent   = cats.size;
}

/* ── SWATCH HELPER ── */
function makeSwatchCSS(color, color2, count) {
  const c1 = color, c2 = color2 || color;
  const brightness = parseInt(c1.slice(1,3), 16);
  const isLight = brightness > 180;
  const vein = isLight ? 'rgba(0,0,0,.06)' : 'rgba(255,255,255,.07)';
  const spec = isLight ? 'rgba(255,255,255,.3)' : 'rgba(255,255,255,.08)';
  return `linear-gradient(135deg, ${c1} 0%, ${c2} 60%, ${c1} 100%)`;
}

function makeTileSwatch(color, color2, gridCols, gridRows, container, size) {
  container.style.background = '#ccc';
  container.innerHTML = '';
  const total = gridCols * gridRows;
  const c1 = color, c2 = color2 || color;
  for (let i = 0; i < total; i++) {
    const s = document.createElement('span');
    const mix = (i % 3 === 0) ? 0.96 : (i % 3 === 1) ? 1 : 0.92;
    s.style.background = `linear-gradient(${135 + i * 17}deg, ${c1}, ${c2})`;
    s.style.filter = `brightness(${mix})`;
    container.appendChild(s);
  }
}

/* ── FILTER PANEL BUILD ── */
function buildFilterPanels() {
  const groups = {
    category: 'filter-category',
    material: 'filter-material',
    look:     'filter-look',
    finish:   'filter-finish',
    series:   'filter-series',
  };
  Object.entries(groups).forEach(([key, id]) => {
    const counts = {};
    PRODUCTS.forEach(p => { counts[p[key]] = (counts[p[key]] || 0) + 1; });
    const el = document.getElementById(id);
    el.innerHTML = '';
    Object.entries(counts).sort((a,b) => b[1]-a[1]).forEach(([val, cnt]) => {
      el.appendChild(makeFilterBtn(key, val, cnt));
    });
  });

  // Features
  const feats = {};
  PRODUCTS.forEach(p => {
    if (p.made_in_usa) feats['Made in USA'] = (feats['Made in USA']||0)+1;
    if (p.new)         feats['New Arrival'] = (feats['New Arrival']||0)+1;
    if (p.bestseller)  feats['Bestseller']  = (feats['Bestseller']||0)+1;
  });
  const felEl = document.getElementById('filter-features');
  felEl.innerHTML = '';
  Object.entries(feats).forEach(([val, cnt]) => {
    felEl.appendChild(makeFilterBtn('feature', val, cnt));
  });
}

function makeFilterBtn(key, val, cnt) {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.dataset.key = key;
  btn.dataset.val = val;
  btn.innerHTML = `${val} <span class="count">(${cnt})</span>`;
  btn.onclick = () => toggleFilter(key, val, btn);
  return btn;
}

function toggleFilter(key, val, btn) {
  if (activeFilters[key] === val) {
    delete activeFilters[key];
    btn.classList.remove('active');
  } else {
    // Deactivate same-group buttons
    document.querySelectorAll(`.filter-btn[data-key="${key}"]`).forEach(b => b.classList.remove('active'));
    activeFilters[key] = val;
    btn.classList.add('active');
  }
  applyFilters();
}

function clearAll() {
  activeFilters = {};
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('search').value = '';
  applyFilters();
}

/* ── ACTIVE FILTER TAGS ── */
function renderActiveTags() {
  const container = document.getElementById('active-filters');
  container.innerHTML = '';
  Object.entries(activeFilters).forEach(([key, val]) => {
    const tag = document.createElement('div');
    tag.className = 'filter-tag';
    tag.innerHTML = `<strong>${key}:</strong> ${val} <button onclick="removeFilter('${key}')">×</button>`;
    container.appendChild(tag);
  });
}

function removeFilter(key) {
  delete activeFilters[key];
  document.querySelectorAll(`.filter-btn[data-key="${key}"]`).forEach(b => b.classList.remove('active'));
  applyFilters();
}

/* ── APPLY FILTERS ── */
function applyFilters() {
  renderActiveTags();
  const q = document.getElementById('search').value.toLowerCase().trim();
  const sort = document.getElementById('sort').value;

  let results = PRODUCTS.filter(p => {
    if (activeFilters.category && p.category !== activeFilters.category) return false;
    if (activeFilters.material && p.material !== activeFilters.material) return false;
    if (activeFilters.look     && p.look     !== activeFilters.look)     return false;
    if (activeFilters.finish   && p.finish   !== activeFilters.finish)   return false;
    if (activeFilters.series   && p.series   !== activeFilters.series)   return false;
    if (activeFilters.feature) {
      if (activeFilters.feature === 'Made in USA' && !p.made_in_usa) return false;
      if (activeFilters.feature === 'New Arrival' && !p.new)         return false;
      if (activeFilters.feature === 'Bestseller'  && !p.bestseller)  return false;
    }
    if (q) {
      const haystack = [p.name, p.series, p.category, p.material, p.look, p.finish, p.description, p.sku].join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  results.sort((a, b) => {
    switch (sort) {
      case 'price-asc':   return a.price - b.price;
      case 'price-desc':  return b.price - a.price;
      case 'rating':      return b.rating - a.rating;
      case 'reviews':     return b.reviews - a.reviews;
      case 'name':        return a.name.localeCompare(b.name);
      case 'new':         return (b.new ? 1 : 0) - (a.new ? 1 : 0);
      default:            return (b.bestseller ? 1 : 0) - (a.bestseller ? 1 : 0);
    }
  });

  renderGrid(results);
  const cnt = document.getElementById('results-count');
  cnt.innerHTML = `Showing <strong>${results.length}</strong> of ${PRODUCTS.length} products`;
  document.getElementById('empty').style.display = results.length ? 'none' : 'block';
  document.getElementById('grid').style.display  = results.length ? 'grid'  : 'none';
}

/* ── RENDER GRID ── */
function renderGrid(products) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  products.forEach(p => grid.appendChild(makeCard(p)));
}

function makeCard(p) {
  const card = document.createElement('article');
  card.className = 'card';
  card.onclick = () => openModal(p);

  const stars = renderStars(p.rating);

  card.innerHTML = `
    <div class="swatch">
      <div class="swatch-inner">
        <div class="swatch-tile" id="st-${p.id}"></div>
      </div>
      <div class="badges">
        ${p.new        ? '<span class="badge badge-new">New</span>'     : ''}
        ${p.bestseller ? '<span class="badge badge-best">⭐ Best</span>': ''}
        ${p.made_in_usa? '<span class="badge badge-usa">🇺🇸 USA</span>'  : ''}
        ${p.category === 'Outdoor / Paver' ? '<span class="badge badge-outdoor">Outdoor</span>' : ''}
      </div>
    </div>
    <div class="card-body">
      <div class="series-name">${p.series}</div>
      <div class="card-name">${p.name}</div>
      <div class="specs">
        <span class="spec">${p.size}</span>
        <span class="spec">${p.material}</span>
        <span class="spec">${p.finish}</span>
      </div>
      <div class="card-footer">
        <div class="price">$${p.price.toFixed(2)}<span class="price-unit"> /sq ft</span></div>
        <div>
          <div class="stars">${stars}</div>
          <div class="review-count">${p.reviews.toLocaleString()} reviews</div>
        </div>
      </div>
    </div>`;

  // Build swatch tiles after insert
  requestAnimationFrame(() => {
    const st = card.querySelector(`#st-${p.id}`);
    if (st) makeTileSwatch(p.color, p.color2, 4, 3, st);
  });

  return card;
}

function renderStars(rating) {
  const full = Math.floor(rating);
  const half = rating - full >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
}

/* ── MODAL ── */
function openModal(p) {
  document.getElementById('modal-series').textContent  = p.series;
  document.getElementById('modal-title').textContent   = p.name;
  document.getElementById('modal-desc').textContent    = p.description;
  document.getElementById('modal-coverage').textContent = `Coverage: ${p.coverage}`;
  document.getElementById('modal-price').innerHTML     = `$${p.price.toFixed(2)} <small>/ sq ft</small>`;
  document.getElementById('modal-stars').textContent   = renderStars(p.rating) + ` ${p.rating}`;
  document.getElementById('modal-reviews').textContent = `${p.reviews.toLocaleString()} reviews`;

  // Hero swatch
  const hero = document.getElementById('modal-hero-swatch');
  makeTileSwatch(p.color, p.color2, 8, 5, hero);

  // Badges
  document.getElementById('modal-badges').innerHTML = [
    p.new         ? '<span class="badge badge-new">New 2024/25</span>'  : '',
    p.bestseller  ? '<span class="badge badge-best">Bestseller</span>'  : '',
    p.made_in_usa ? '<span class="badge badge-usa">Made in USA</span>'  : '',
    p.category === 'Outdoor / Paver' ? '<span class="badge badge-outdoor">Outdoor Rated</span>' : ''
  ].join('');

  // Specs grid
  document.getElementById('modal-specs').innerHTML = [
    { label: 'Size',      value: p.size },
    { label: 'Material',  value: p.material },
    { label: 'Finish',    value: p.finish },
    { label: 'Look',      value: p.look },
    { label: 'Category',  value: p.category },
    { label: 'SKU',       value: p.sku },
  ].map(s => `<div class="spec-item"><div class="label">${s.label}</div><div class="value">${s.value}</div></div>`).join('');

  // Applications
  document.getElementById('modal-apps').innerHTML =
    p.applications.map(a => `<span class="app-tag">${a}</span>`).join('');

  document.getElementById('modal-backdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-backdrop')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modal-backdrop').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });
</script>
</body>
</html>
